name: release

# Every push to main runs the integration suite, then semantic-release cuts the
# next version from the conventional commits since the last tag (.releaserc.yml)
# and pushes the tag, and goreleaser publishes the GitHub release for that tag
# (.goreleaser.yaml). goreleaser runs here rather than on a tag push because a
# tag pushed with GITHUB_TOKEN triggers no workflow.

on:
  push:
    branches: [main]

permissions:
  contents: read

# Serialized on a constant group and never cancelled mid-run: two runs would
# race to compute the same next version from the same baseline tag. A group
# holds one pending run, so a third push cancels the queued second; nothing is
# lost, since the next run releases every commit since the last tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  integration:
    uses: ./.github/workflows/integration.yml

  semantic-release:
    needs: integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Forks must not publish under the upstream name.
    if: github.repository == 'jhoblitt/rooket'
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json

      # The lockfile pins the whole graph; with install scripts off, none of it
      # runs code before semantic-release holds the write-scoped token.
      - name: Install semantic-release
        run: npm ci --ignore-scripts --no-audit --no-fund

      # semantic-release starts at 1.0.0 and has no setting for a lower first
      # version. Until rooket has a release, a v0.0.0 tag on the root commit
      # makes the first one 0.1.0. semantic-release pushes every local tag, so
      # the seed reaches origin in the same push as v0.1.0 and is never the
      # newest version `go install …@latest` would resolve.
      - name: Seed the 0.x line
        run: |
          if [ -z "$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*')" ]; then
            git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD)"
          fi

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node_modules/.bin/semantic-release

      # The tag at HEAD goes on to goreleaser unless it already has a published
      # release, whose archives consumers pin by hash and so are never rebuilt.
      # A re-run therefore publishes a tag an earlier attempt pushed but never
      # released. Runs even when semantic-release failed after pushing.
      - name: Read the release tag
        id: tag
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*')
          if [ -n "$tag" ]; then
            git ls-remote --exit-code --tags origin "refs/tags/$tag"
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null)" = false ]; then
              tag=""
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  goreleaser:
    needs: semantic-release
    # Without a status function a failed semantic-release job would skip this
    # one, even when it had already pushed the tag.
    if: ${{ !cancelled() && needs.semantic-release.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ needs.semantic-release.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      # No check-latest: the release builds with the Go patch integration.yml's
      # build job resolves, rather than whichever is newest at release time.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The binary carries no -X ldflags: go build stamps the module version
      # from the tag. Prove the checkout produces that stamp before releasing.
      - name: Assert the tag is the version the binary reports
        run: |
          go build -o "$RUNNER_TEMP/rooket" .
          stamped=$(go version -m "$RUNNER_TEMP/rooket" | awk '$1 == "mod" { print $3 }')
          [ "$stamped" = "$TAG" ] || { echo "binary stamped '$stamped', want '$TAG'"; exit 1; }

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # An exact goreleaser, since this job holds a write token and an OIDC
      # token. Dependabot bumps only the action, not this input, so bump it by
      # hand.
      - name: goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
