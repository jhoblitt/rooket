version: 2
updates:
  # Bumps the commit-SHA action pins (pinact's "# vX.Y.Z" comments make them
  # Dependabot-readable).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  # semantic-release and its preset, which cut the release tags.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      semantic-release:
        patterns: ["*"]
